<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Upload your photos</title>
<style>
  :root{--blue:#0b5fa5;--gold:#f2a900;--brown:#4a2c17;--cream:#fff8e7}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.4 -apple-system,system-ui,sans-serif;background:var(--cream);color:var(--brown)}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:26px;margin:8px 0}
  .btn{display:block;width:100%;padding:16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:700 18px system-ui;margin-top:14px}
  .btn.alt{background:var(--gold);color:var(--brown)}
  .note{font-size:13px;opacity:.8;margin-top:10px}
  .msg{background:#fff;border:1px solid #e3d3a8;border-radius:10px;padding:10px 12px;margin-top:12px}
  .hidden{display:none}
  #list{list-style:none;margin:14px 0 0;padding:0}
  .item{display:flex;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:8px;margin-bottom:8px}
  .thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#eadfc0;flex:none}
  .info{flex:1;min-width:0}
  .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{font-size:12px;opacity:.85}
  .bar{height:8px;background:#eadfc0;border-radius:4px;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
  .retry{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:8px 10px;font:600 13px system-ui}
  .done .status::before{content:"\2713  ";color:#1a8f3c;font-weight:700}
  .failed .status{color:#b3261e}
  textarea{width:100%;height:80px;font:12px monospace}
</style>
</head>
<body>
<main>
  <h1>Share your photos &amp; videos (TEST MODE)</h1>

  <section id="welcome">
    <button class="btn" id="pick" disabled>Upload</button>
    <p class="note">Keep this page open until uploads finish.</p>
    <p class="note">By uploading, you agree your photos may be shared by the event organizer.</p>
  </section>

  <section id="closed" class="hidden">
    <div class="msg">Uploads are not available right now.</div>
  </section>

  <section id="queue" class="hidden">
    <div class="msg" id="counter"></div>
    <div class="msg hidden" id="warn"></div>
    <ul id="list"></ul>
    <p class="note" id="keepopen">Keep this page open until uploads finish.</p>
    <button class="btn alt hidden" id="more">Upload more</button>
  </section>

  <input type="file" id="file" accept="image/*,video/*" multiple class="hidden">
</main>

<script src="uploader.js"></script>
<script src="credcrypto.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
// The event code in the link decrypts credential.enc.json (key, folder and event name live inside it).
const EVENT_CODE = params.get('event') || '';

let client = null, items = [], running = false, wakeLock = null;

async function init() {
  try {
    if (!EVENT_CODE) throw new Error('no code');
    const r = await fetch('credential.enc.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('no credential file');
    const cred = await CredCrypto.decrypt(await r.json(), EVENT_CODE);
    client = Uploader.createClient({ credential: cred, folderId: cred.folderId, eventName: cred.eventName || 'event' });
    $('pick').disabled = false;
  } catch (e) { show('closed'); } // wrong or missing code looks the same as "closed"
}
init();

function show(id) { for (const s of ['welcome', 'closed', 'queue']) $(s).classList.toggle('hidden', s !== id); }

$('pick').onclick = () => $('file').click();
$('more').onclick = () => { items.forEach((i) => i.thumbUrl && URL.revokeObjectURL(i.thumbUrl)); items = []; $('list').innerHTML = ''; $('more').classList.add('hidden'); show('welcome'); };

$('file').onchange = async () => {
  let files = [...$('file').files];
  $('file').value = '';
  if (!files.length) return;
  if (!client) { show('closed'); return; }

  const warn = $('warn');
  warn.classList.toggle('hidden', files.length <= Uploader.MAX_FILES);
  if (files.length > Uploader.MAX_FILES) { warn.textContent = 'You can select up to 20 files at a time.'; files = files.slice(0, Uploader.MAX_FILES); }

  items = files.map(makeItem);
  show('queue');
  runQueue();
};

function makeItem(file) {
  const li = document.createElement('li');
  const kind = file.type.startsWith('video') || ['mp4', 'mov'].includes(Uploader.extOf(file.name)) ? 'video' : 'image';
  const it = { file, li, state: 'waiting', kind };
  const thumb = document.createElement(kind === 'video' ? 'video' : 'img');
  thumb.className = 'thumb';
  it.thumbUrl = URL.createObjectURL(file);
  thumb.src = kind === 'video' ? it.thumbUrl + '#t=0.1' : it.thumbUrl;
  if (kind === 'video') { thumb.muted = true; thumb.playsInline = true; thumb.preload = 'metadata'; }
  thumb.onerror = () => { thumb.style.visibility = 'hidden'; };
  const info = document.createElement('div'); info.className = 'info';
  it.nameEl = document.createElement('div'); it.nameEl.className = 'name'; it.nameEl.textContent = file.name;
  it.statusEl = document.createElement('div'); it.statusEl.className = 'status';
  const bar = document.createElement('div'); bar.className = 'bar';
  it.barEl = document.createElement('i'); bar.appendChild(it.barEl);
  info.append(it.nameEl, it.statusEl, bar);
  it.retryEl = document.createElement('button'); it.retryEl.className = 'retry hidden'; it.retryEl.textContent = 'Retry';
  it.retryEl.onclick = () => { setState(it, 'waiting'); runQueue(); };
  li.className = 'item'; li.append(thumb, info, it.retryEl);
  $('list').appendChild(li);

  const bad = Uploader.validate(file);
  if (bad) setState(it, 'rejected', bad === 'size' ? 'Too large (max 2 GB)' : bad === 'empty' ? 'Empty file' : 'File type not supported');
  else setState(it, 'waiting');
  return it;
}

function setState(it, state, text) {
  it.state = state;
  it.li.classList.toggle('done', state === 'done');
  it.li.classList.toggle('failed', state === 'failed' || state === 'rejected');
  it.statusEl.textContent = text || { waiting: 'Waiting', uploading: 'Uploading', done: 'Done', failed: 'Upload failed, tap to retry' }[state];
  it.retryEl.classList.toggle('hidden', state !== 'failed');
  if (state === 'done') it.barEl.style.width = '100%';
  if (state === 'waiting') it.barEl.style.width = '0';
  updateCounter();
}

function updateCounter() {
  const valid = items.filter((i) => i.state !== 'rejected');
  const done = valid.filter((i) => i.state === 'done').length;
  const failed = valid.filter((i) => i.state === 'failed').length;
  const finished = !running && valid.every((i) => i.state === 'done' || i.state === 'failed');
  let t = `${done} of ${valid.length} uploaded`;
  if (finished && !failed && valid.length) t = 'Upload complete! Prost!';
  else if (finished && failed) t += `, ${failed} failed`;
  $('counter').textContent = t;
  $('more').classList.toggle('hidden', !finished);
  $('keepopen').classList.toggle('hidden', finished);
}

async function runQueue() {
  if (running) return;
  running = true;
  await acquireWakeLock();
  window.addEventListener('beforeunload', warnLeave);
  for (const it of items) {
    if (it.state !== 'waiting') continue;
    setState(it, 'uploading');
    try {
      await client.upload(it, (p) => { it.barEl.style.width = Math.round(p * 100) + '%'; });
      setState(it, 'done');
    } catch (e) {
      setState(it, 'failed', e.code === 'token' ? "Couldn't connect. Check your phone's date and time, then tap to retry." : undefined);
    }
  }
  running = false;
  window.removeEventListener('beforeunload', warnLeave);
  releaseWakeLock();
  updateCounter();
  if (items.some((i) => i.state === 'waiting')) runQueue(); // a retry was tapped while finishing
}

const warnLeave = (e) => { e.preventDefault(); e.returnValue = ''; };

async function acquireWakeLock() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.onrelease = () => { wakeLock = null; }; } } catch (_) {}
}
function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (_) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') acquireWakeLock(); });
</script>
</body>
</html>
